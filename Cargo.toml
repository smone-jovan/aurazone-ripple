[package]
name = "aura_zone_ripple"
version = "0.1.0"
edition = "2021"
authors = ["ROG User"]
description = "Low-memory native reactive 4-zone RGB ripple lighting for ASUS ROG Strix G513RC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smone-jovan/aurazone-ripple"

[lib]
name = "aura_zone_ripple"
path = "src/lib.rs"

[[bin]]
name = "aurazone_ripple"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "1.0"

# Win32 OS bindings (lightweight raw FFI bindings)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
] }

# Concurrency & Channels
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI Parsing (Milestone 3)
clap = { version = "4.5", features = ["derive"] }

# Native GUI (Milestone 4)
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
